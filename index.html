<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Suburban Descent</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#090c12;font-family:Impact,"Arial Black",sans-serif}canvas{display:block}#game{position:fixed;inset:0}
#hud{position:fixed;inset:0;pointer-events:none;color:#fff;text-shadow:3px 3px 0 #111}#top{position:absolute;top:18px;left:22px;display:flex;gap:10px}.chip{background:rgba(12,15,20,.82);border:2px solid rgba(255,255,255,.15);border-radius:6px;padding:8px 12px;font:800 14px Arial}.chip b{color:#9ff183;font-size:18px}
#titleCard{position:absolute;top:20px;left:50%;transform:translateX(-50%);text-align:center;letter-spacing:2px}.micro{font:700 11px Arial;color:#b8c3b7;text-shadow:1px 1px #000}#titleCard h1{margin:2px 0;font-size:25px;color:#f3dfad;-webkit-text-stroke:1px #4a341c}
#cross{position:absolute;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%)}#cross:before,#cross:after{content:"";position:absolute;background:#fff;box-shadow:0 0 3px #000}#cross:before{width:18px;height:3px;left:0;top:7px}#cross:after{height:18px;width:3px;left:7px;top:0}
#prompt{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);display:none;padding:10px 16px;background:#111c;border:2px solid #fff;border-radius:5px;font:900 16px Arial;letter-spacing:1px}#prompt.show{display:block}
#hp{position:absolute;left:22px;bottom:24px;width:240px}.bar{height:19px;border:3px solid #fff;background:#401b1b;border-radius:3px;overflow:hidden}.fill{height:100%;width:100%;background:linear-gradient(90deg,#cf2d23,#76c84a)}#hpText{margin-top:5px;font-size:22px}.ammo{position:absolute;right:22px;bottom:22px;text-align:right}.ammo strong{display:block;font-size:44px;color:#ffd85b;-webkit-text-stroke:1px #4d3a00}.ammo span{font:900 11px Arial;color:#ddd}
#damage{position:absolute;inset:0;opacity:0;border:18px solid #e82525;box-shadow:inset 0 0 80px #e82525;transition:opacity .12s}
#overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,27,30,.25),rgba(5,7,10,.75));display:flex;align-items:center;justify-content:center;text-align:center}.panel{max-width:min(680px,88vw);border:3px solid #bba976;border-radius:8px;background:rgba(14,19,21,.94);padding:30px 38px;box-shadow:0 20px 70px #000}.panel h1{font-size:52px;margin:0 0 8px;color:#f1dfaa;text-shadow:4px 4px #4b3520}.panel p{font:700 15px Arial;line-height:1.7;color:#dce2da}.panel button{pointer-events:auto;border:2px solid #fff;border-radius:5px;background:#a33e2b;color:#fff;font:900 17px Arial;padding:13px 28px;cursor:pointer;box-shadow:0 5px 0 #4e1d16;margin-top:12px}.panel button:hover{background:#ce5738}.hidden{display:none!important}
#objective{position:absolute;right:22px;top:68px;max-width:260px;text-align:right;font:900 13px Arial;color:#fff}#objective b{color:#ffd85b}
#touch{display:none;position:absolute;inset:0}.stick,.shoot{position:absolute;pointer-events:auto;border:2px solid rgba(255,255,255,.3);border-radius:50%;background:rgba(255,255,255,.08)}.stick{width:110px;height:110px;left:18px;bottom:20px}.shoot{width:82px;height:82px;right:24px;bottom:32px}.stick:after,.shoot:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.25)}.stick:after{width:48px;height:48px;left:29px;top:29px}.shoot:after{width:54px;height:54px;left:12px;top:12px}
@media(max-width:700px),(pointer:coarse){#touch{display:block}.ammo{bottom:8px}.ammo strong{font-size:34px}#hp{bottom:14px;width:180px}#titleCard h1{font-size:18px}.chip{padding:6px 8px}.panel h1{font-size:38px}}
</style>
</head>
<body>
<div id="game"></div><div id="hud"><div id="top"><div class="chip">BODIES <b id="kills">0</b></div><div class="chip">KEYS <b id="keys">0/3</b></div></div><div id="titleCard"><div class="micro">PLEASANTDALE COUNTY</div><h1 id="zone">CREEKWOOD AVE</h1></div><div id="objective">OBJECTIVE<br><b id="obj">ENTER A HOUSE</b></div><div id="cross"></div><div id="prompt">PRESS E — ENTER</div><div id="damage"></div><div id="hp"><div class="bar"><div class="fill" id="hpFill"></div></div><div id="hpText">♥ 100</div></div><div class="ammo"><strong id="ammo">18</strong><span>SHOTGUN SHELLS</span></div><div id="touch"><div class="stick" id="stick"></div><div class="shoot" id="shoot"></div></div><div id="overlay"><div class="panel"><div class="micro">A NEIGHBORHOOD FROM HELL</div><h1>SUBURBAN DESCENT</h1><p>Walk the sunny streets. Enter marked homes and survive the horrors inside. Clear all three demon houses to reclaim Pleasantdale.</p><button id="start">START THE HAUNT</button></div></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js';
const game=document.getElementById('game'),overlay=document.getElementById('overlay'),prompt=document.getElementById('prompt');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x87a5a0);scene.fog=new THREE.Fog(0x87a5a0,30,95);
const camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.1,160);camera.position.set(0,2,13);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;game.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xddeeff,0x6e5b42,2));const sun=new THREE.DirectionalLight(0xffefd2,2.5);sun.position.set(-30,40,20);sun.castShadow=true;scene.add(sun);
let mode='home',started=false,keys=0,kills=0,health=100,ammo=18,nearHouse=null,yaw=0,pitch=0,canShoot=true,last=performance.now();
const houses=[],levels=[],enemies=[],bullets=[],keys3=[];
const mat=(c,r=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r});
function box(name,sx,sy,sz,c,x,y,z,rough=0){const m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),mat(c,rough));m.name=name;m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;scene.add(m);return m}
function ground(){box('road',100,.15,100,0x42484a,0,-.08,0,.9);box('sidewalk',100,.12,5,0xaaa99c,0,.02,18,.9);box('sidewalk',100,.12,5,0xaaa99c,0,.02,-18,.9);for(let i=-80;i<80;i+=8){box('grass',3,.02,36,0x5f7a58,i,-.02,0,.9)} }
function makeHouse(x,z,color,name){const g=new THREE.Group();const base=new THREE.Mesh(new THREE.BoxGeometry(10,6,12),mat(color));base.position.y=3;base.castShadow=base.receiveShadow=true;g.add(base);
const roof=new THREE.Mesh(new THREE.ConeGeometry(8,4,4),mat(0x4e4b42));roof.position.y=8;roof.rotation.y=Math.PI/4;roof.scale.z=.9;roof.castShadow=true;g.add(roof);
const door=new THREE.Mesh(new THREE.BoxGeometry(2.4,3.8,.25),mat(0x3a2620));door.position.set(0,2,-6.1);g.add(door);const knob=new THREE.Mesh(new THREE.SphereGeometry(.12),mat(0xd6bb70,.3));knob.position.set(.75,2,-6.25);g.add(knob);
for(const dx of [-3.4,3.4]){const w=new THREE.Mesh(new THREE.BoxGeometry(2,.6,0.2),mat(name.includes('RED')?0x5aa0c4:0x87a9b0,.4));w.position.set(dx,3,-6.11);g.add(w)}
const porch=new THREE.Mesh(new THREE.BoxGeometry(5,.15,3),mat(0xaaa08a));porch.position.set(0,.1,-7.5);g.add(porch);g.position.set(x,0,z);scene.add(g);houses.push({g,x,z,door,used:false,name})}
ground();makeHouse(-24,-28,0xb8b09a,'RED HOUSE');makeHouse(0,-28,0xc8bda1,'YELLOW HOUSE');makeHouse(24,-28,0x8fa6a3,'BLUE HOUSE');makeHouse(-24,28,0x9d9b83,'GREEN HOUSE');makeHouse(24,28,0xb49a86,'TAN HOUSE');
// neighborhood details
for(let i=-36;i<=36;i+=12){box('treeTrunk',.5,4,.5,0x4b3827,i,2,-8,.9);const c=new THREE.Mesh(new THREE.ConeGeometry(3,7,7),mat(0x416443));c.position.set(i,7,-8);c.castShadow=true;scene.add(c)}
for(const x of [-40,-32,-16,-8,8,16,32,40]){box('mailbox',.8,1,.7,0x30404a,x,.7,15,.5)}
function clearLevel(){for(const e of enemies)scene.remove(e.mesh);enemies.length=0;for(const b of bullets)scene.remove(b);bullets.length=0;for(const k of keys3)scene.remove(k.mesh);keys3.length=0;
 for(let i=scene.children.length-1;i>=0;i--){const o=scene.children[i];if(o.userData.level)scene.remove(o)}}
function levelBox(sx,sy,sz,c,x,y,z){const m=box('levelwall',sx,sy,sz,c,x,y,z,.8);m.userData.level=true;return m}
function enterLevel(h){clearLevel();mode='level';h.used=true;scene.background=new THREE.Color(0x210b09);scene.fog=new THREE.Fog(0x210b09,10,55);camera.position.set(0,2,24);houses.forEach(o=>o.g.visible=false);h.g.visible=false;
 levelBox(40,5,2,0x5b4b3c,0,2.5,-30);levelBox(40,5,2,0x3d342c,0,2.5,30);levelBox(2,5,62,0x5b4b3c,-20,2.5,0);levelBox(2,5,62,0x3d342c,20,2.5,0);
 levelBox(14,5,2,0x6e604d,-8,2.5,-12);levelBox(14,5,2,0x6e604d,8,2.5,8);levelBox(2,5,14,0x6e604d,-12,2.5,-1);levelBox(2,5,14,0x6e604d,12,2.5,16);
 // exit key
 const km=new THREE.Mesh(new THREE.TorusGeometry(.7,.16,8,16),mat(0xd9bd44,.25));km.position.set(0,1.4,-24);km.userData.level=true;scene.add(km);keys3.push({mesh:km,got:false});
 for(let i=0;i<5;i++)spawnEnemy(-14+i*7,-18+i%3*9,i%2?0x7e281f:0x6c6b30);document.getElementById('zone').textContent='Demonized '+h.name;document.getElementById('obj').textContent='CLEAR THE HOUSE';}
function spawnEnemy(x,z,c){const g=new THREE.Group();const body=new THREE.Mesh(new THREE.CapsuleGeometry(.7,1.2,4,8),mat(c,.7));body.position.y=1.4;g.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.65),mat(0x9a392b,.6));head.position.y=2.8;g.add(head);const eye=new THREE.Mesh(new THREE.BoxGeometry(.25,.12,.12),mat(0xffef55,.2));eye.position.set(0,2.85,-.62);g.add(eye);g.position.set(x,0,z);g.userData.level=true;scene.add(g);enemies.push({mesh:g,hp:3,hit:0})}
function exitLevel(){clearLevel();mode='home';scene.background=new THREE.Color(0x87a5a0);scene.fog=new THREE.Fog(0x87a5a0,30,95);houses.forEach(o=>o.g.visible=true);keys++;health=Math.min(100,health+25);ammo+=6;camera.position.set(0,2,13);document.getElementById('zone').textContent='CREEKWOOD AVE';document.getElementById('keys').textContent=keys+'/3';document.getElementById('obj').textContent=keys>=3?'NEIGHBORHOOD SAVED':'ENTER ANOTHER HOUSE';if(keys>=3)win();}
function win(){overlay.classList.remove('hidden');overlay.innerHTML='<div class="panel"><div class="micro">PLEASANTDALE IS SAFE</div><h1>NEIGHBORHOOD SAVED</h1><p>You cleared '+kills+' demons and survived the suburban nightmare.</p><button onclick="location.reload()">WALK AGAIN</button></div>'}
function shoot(){if(!started||ammo<=0||!canShoot)return;ammo--;document.getElementById('ammo').textContent=ammo;canShoot=false;setTimeout(()=>canShoot=true,260);
 const origin=camera.position.clone();const dir=new THREE.Vector3();camera.getWorldDirection(dir);const tracer=new THREE.Mesh(new THREE.SphereGeometry(.08),mat(0xffc34d));tracer.position.copy(origin).add(dir.clone().multiplyScalar(.6));tracer.userData.level=true;scene.add(tracer);bullets.push({mesh:tracer,life:.8,dir:dir.clone()});
 if(mode==='level')for(const e of enemies){const d=e.mesh.position.clone().add(new THREE.Vector3(0,1.4,0));if(d.distanceTo(origin)<22&&dir.dot(d.sub(origin).normalize())>.96){e.hp--;e.hit=.15;if(e.hp<=0){scene.remove(e.mesh);e.dead=true;kills++;document.getElementById('kills').textContent=kills}}}}
function updateHud(){document.getElementById('hpFill').style.width=health+'%';document.getElementById('hpText').textContent='♥ '+health}
const keysDown={};addEventListener('keydown',e=>{keysDown[e.code]=true;if(e.code==='KeyE'&&nearHouse&&mode==='home')enterLevel(nearHouse);if(e.code==='KeyR'&&mode==='level')exitLevel();});addEventListener('keyup',e=>keysDown[e.code]=false);addEventListener('mousedown',e=>{if(e.target===renderer.domElement)shoot()});
addEventListener('mousemove',e=>{if(document.pointerLockElement===renderer.domElement){yaw-=e.movementX*.002;pitch-=e.movementY*.002;pitch=Math.max(-1.25,Math.min(1.25,pitch))}});renderer.domElement.addEventListener('click',()=>{if(started&&innerWidth>700)renderer.domElement.requestPointerLock()});
document.getElementById('start').onclick=()=>{started=true;overlay.classList.add('hidden');if(innerWidth>700)renderer.domElement.requestPointerLock?.()};prompt.addEventListener('touchstart',e=>{e.preventDefault();if(nearHouse&&mode==='home')enterLevel(nearHouse)},{passive:false});prompt.addEventListener('click',()=>{if(nearHouse&&mode==='home')enterLevel(nearHouse)});
// touch controls
let touchMove={x:0,y:0},stickTouch=null,lookTouch=null;const stick=document.getElementById('stick');stick.addEventListener('touchstart',e=>{stickTouch=e.changedTouches[0].identifier},{passive:false});stick.addEventListener('touchmove',e=>{for(const t of e.changedTouches)if(t.identifier===stickTouch){const r=stick.getBoundingClientRect();touchMove.x=(t.clientX-(r.left+r.width/2))/55;touchMove.y=(t.clientY-(r.top+r.height/2))/55;e.preventDefault()}},{passive:false});stick.addEventListener('touchend',()=>{touchMove={x:0,y:0}});document.getElementById('shoot').addEventListener('touchstart',e=>{e.preventDefault();shoot()},{passive:false});addEventListener('touchstart',e=>{if(e.target===renderer.domElement){const t=e.changedTouches[0];lookTouch={id:t.identifier,x:t.clientX,y:t.clientY}}},{passive:false});addEventListener('touchmove',e=>{if(lookTouch){for(const t of e.changedTouches)if(t.identifier===lookTouch.id){yaw-=(t.clientX-lookTouch.x)*.006;pitch-=(t.clientY-lookTouch.y)*.006;pitch=Math.max(-1.25,Math.min(1.25,pitch));lookTouch.x=t.clientX;lookTouch.y=t.clientY}}},{passive:false});addEventListener('touchend',e=>{for(const t of e.changedTouches)if(lookTouch&&t.identifier===lookTouch.id)lookTouch=null});
function animate(now){requestAnimationFrame(animate);const dt=Math.min(.05,(now-last)/1000);last=now;if(started){let fx=0,fz=0;if(keysDown.KeyW)fz-=1;if(keysDown.KeyS)fz+=1;if(keysDown.KeyA)fx-=1;if(keysDown.KeyD)fx+=1;if(touchMove.y)fz+=touchMove.y;if(touchMove.x)fx+=touchMove.x;camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch;const forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));const right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));const move=forward.multiplyScalar(-fz).add(right.multiplyScalar(fx));if(move.lengthSq()){move.normalize().multiplyScalar(dt*(mode==='level'?7:6));camera.position.add(move);camera.position.x=Math.max(-46,Math.min(46,camera.position.x));camera.position.z=Math.max(-45,Math.min(45,camera.position.z))}
 nearHouse=null;if(mode==='home')for(const h of houses){if(!h.used&&camera.position.distanceTo(new THREE.Vector3(h.x,2,h.z))<10){nearHouse=h;break}}prompt.classList.toggle('show',!!nearHouse);
 if(mode==='level'){for(const b of bullets){b.life-=dt;b.mesh.position.addScaledVector(b.dir,dt*28);if(b.life<=0){scene.remove(b.mesh)}}for(let i=bullets.length-1;i>=0;i--)if(bullets[i].life<=0)bullets.splice(i,1);
 for(let i=enemies.length-1;i>=0;i--){const e=enemies[i];if(e.dead){enemies.splice(i,1);continue}const dir=camera.position.clone().sub(e.mesh.position);dir.y=0;if(dir.length()>1.1){dir.normalize();e.mesh.position.addScaledVector(dir,dt*(1.1+Math.random()*0.15));e.mesh.lookAt(camera.position)}if(e.mesh.position.distanceTo(camera.position)<1.8){health-=18*dt;updateHud();if(health<=0){health=100;exitLevel()}}}for(const k of keys3){k.mesh.rotation.y+=dt;k.mesh.position.y=1.4+Math.sin(now*.003)*.2;if(k.mesh.position.distanceTo(camera.position)<1.5)k.got=true;if(k.got&&enemies.length===0){exitLevel();break}}}}
 renderer.render(scene,camera)}animate(performance.now());
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body></html>
